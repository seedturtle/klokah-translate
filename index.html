<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>族語翻譯互動學習</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f1a;
      --card: #1a1a2e;
      --card-hover: #222240;
      --primary: #6c63ff;
      --primary-light: #8b83ff;
      --accent: #ff6b6b;
      --accent2: #ffd93d;
      --accent3: #6bcb77;
      --accent4: #45b7d1;
      --text: #e8e8f0;
      --text-dim: #8888aa;
      --border: #2a2a4a;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    /* Header */
    .header {
      background: linear-gradient(135deg, #1a1a3e 0%, #2a1a4e 50%, #1a2a3e 100%);
      padding: 30px 20px 20px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .header h1 {
      font-size: 26px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary-light), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header p {
      color: var(--text-dim);
      font-size: 13px;
      margin-top: 6px;
    }
    /* Mode Tabs */
    .mode-tabs {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-top: 14px;
    }
    .mode-tab {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 22px;
      color: var(--text-dim);
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-tab:hover { background: var(--card-hover); color: var(--text); }
    .mode-tab.active {
      background: linear-gradient(135deg, rgba(108,99,255,0.3), rgba(108,99,255,0.1));
      border-color: var(--primary);
      color: #fff;
    }
    /* Controls */
    .controls {
      max-width: 900px;
      margin: 16px auto;
      padding: 0 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .controls label {
      font-size: 13px;
      color: var(--text-dim);
      font-weight: 500;
      white-space: nowrap;
    }
    .controls select, .controls input, .controls button {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
      flex: 1;
      min-width: 100px;
    }
    .controls select:focus, .controls input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(108,99,255,0.2);
    }
    .controls select option { background: var(--card); color: var(--text); }
    .controls .btn-action {
      background: linear-gradient(135deg, var(--primary), #5a52e0);
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: 500;
      flex: 0 0 auto;
    }
    .controls .btn-action:hover { background: var(--primary-light); }
    .controls .btn-action:disabled { opacity: 0.4; cursor: default; }
    /* Sections */
    .section { display: none; }
    .section.active { display: block; }
    /* Category Grid */
    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 0 16px;
    }
    .section-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-dim);
      margin: 20px 0 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title span { color: var(--primary-light); }
    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 6px;
      margin-bottom: 16px;
    }
    .category-btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 6px;
      color: var(--text-dim);
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      line-height: 1.3;
    }
    .category-btn:hover { background: var(--card-hover); border-color: var(--primary); color: var(--text); transform: translateY(-1px); }
    .category-btn.active { background: linear-gradient(135deg, rgba(108,99,255,0.3), rgba(108,99,255,0.1)); border-color: var(--primary); color: #fff; box-shadow: 0 0 20px rgba(108,99,255,0.15); }
    /* Word Display */
    .word-area { margin: 14px 0 30px; position: relative; }
    .word-card {
      background: linear-gradient(145deg, #1e1e38, #16162a);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 28px;
      text-align: center;
      position: relative;
      overflow: hidden;
      min-height: 240px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .word-card::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle at 50% 50%, rgba(108,99,255,0.04) 0%, transparent 60%);
      pointer-events: none;
    }
    .word-level { position: absolute; top: 14px; left: 14px; background: rgba(108,99,255,0.2); color: var(--primary-light); font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 500; }
    .word-number { position: absolute; top: 14px; right: 14px; color: var(--text-dim); font-size: 11px; opacity: 0.5; }
    .word-indigenous { font-size: 40px; font-weight: 700; color: #fff; letter-spacing: 1px; margin-bottom: 4px; text-shadow: 0 0 30px rgba(108,99,255,0.2); }
    .word-chinese { font-size: 26px; font-weight: 500; color: var(--accent2); margin-bottom: 6px; }
    .word-english { font-size: 14px; color: var(--text-dim); font-style: italic; }
    .word-memo { font-size: 13px; color: var(--accent3); margin-top: 8px; opacity: 0.8; }
    .word-actions { display: flex; gap: 12px; margin-top: 16px; }
    .btn-audio {
      background: var(--primary); border: none; border-radius: 50%; width: 48px; height: 48px;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      transition: all 0.2s; font-size: 20px; color: #fff;
      box-shadow: 0 4px 15px rgba(108,99,255,0.3);
    }
    .btn-audio:hover { transform: scale(1.1); background: var(--primary-light); }
    .btn-audio:active { transform: scale(0.95); }
    .btn-audio.playing { animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(108,99,255,0.5); } 50% { box-shadow: 0 0 0 15px rgba(108,99,255,0); } }
    .word-nav { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 14px; }
    .nav-btn { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 18px; color: var(--text); font-size: 14px; cursor: pointer; transition: all 0.2s; font-family: inherit; }
    .nav-btn:hover { background: var(--card-hover); border-color: var(--primary); }
    .nav-btn:disabled { opacity: 0.3; cursor: default; }
    .nav-count { color: var(--text-dim); font-size: 13px; min-width: 56px; text-align: center; }
    /* Loading */
    .loading-overlay { display: none; position: absolute; inset: 0; background: rgba(15,15,26,0.85); border-radius: 20px; align-items: center; justify-content: center; flex-direction: column; z-index: 10; gap: 14px; }
    .loading-spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    .loading-text { color: var(--text-dim); font-size: 13px; }
    .error-msg { display: none; padding: 30px; text-align: center; color: var(--accent); font-size: 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* Status */
    .status-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
    .status-info { font-size: 13px; color: var(--text-dim); }
    .status-info strong { color: var(--text); }
    .view-switch { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 7px 14px; color: var(--text-dim); font-size: 12px; cursor: pointer; transition: all 0.2s; font-family: inherit; }
    .view-switch:hover { background: var(--card-hover); color: var(--text); }
    /* List View */
    .list-view { display: none; margin: 14px 0 30px; }
    .list-view.active { display: block; }
    .list-header { display: grid; grid-template-columns: 40px 1fr 1fr 40px; gap: 6px; padding: 8px 14px; font-size: 11px; color: var(--text-dim); border-bottom: 1px solid var(--border); font-weight: 500; }
    .list-item { display: grid; grid-template-columns: 40px 1fr 1fr 40px; gap: 6px; padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.04); cursor: pointer; transition: background 0.15s; align-items: center; }
    .list-item:hover { background: var(--card-hover); }
    .list-item.active { background: rgba(108,99,255,0.1); border-left: 3px solid var(--primary); }
    .list-item .li-level { font-size: 11px; color: var(--primary-light); }
    .list-item .li-ab { font-size: 14px; font-weight: 500; color: #fff; }
    .list-item .li-ch { font-size: 13px; color: var(--accent2); }
    .list-item .li-sound { background: none; border: 1px solid var(--border); border-radius: 6px; width: 30px; height: 30px; cursor: pointer; color: var(--text-dim); font-size: 14px; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
    .list-item .li-sound:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
    /* ============ TRANSLATE SECTION ============ */
    .translate-area { max-width: 700px; margin: 0 auto; padding: 20px 0; }
    .translate-input-area {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .translate-input-area textarea {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 18px;
      font-family: inherit;
      resize: vertical;
      min-height: 80px;
      outline: none;
      line-height: 1.6;
    }
    .translate-input-area textarea::placeholder { color: var(--text-dim); opacity: 0.6; }
    .translate-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn-translate {
      background: linear-gradient(135deg, var(--primary), #5a52e0);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 30px;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-translate:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(108,99,255,0.3); }
    .btn-translate:disabled { opacity: 0.4; cursor: default; transform: none; box-shadow: none; }
    .dict-status { font-size: 12px; color: var(--text-dim); }
    .dict-status.loaded { color: var(--accent3); }
    .dict-status .dict-count { color: var(--accent2); font-weight: 700; }
    /* Translation Result */
    .trans-result {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      min-height: 100px;
    }
    .trans-result:empty { display: none; }
    .trans-word-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .trans-word-row:last-child { border-bottom: none; }
    .trans-word-ch {
      font-size: 18px;
      font-weight: 500;
      color: var(--accent2);
      min-width: 60px;
    }
    .trans-word-arrow {
      color: var(--text-dim);
      font-size: 14px;
      opacity: 0.5;
    }
    .trans-word-ab {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      flex: 1;
    }
    .trans-word-ab.unmatched {
      color: var(--text-dim);
      opacity: 0.5;
      font-weight: 400;
      font-style: italic;
    }
    .trans-word-audio {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 34px;
      height: 34px;
      cursor: pointer;
      color: var(--text-dim);
      font-size: 14px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .trans-word-audio:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
    .trans-word-row.playing { background: rgba(108,99,255,0.15); border-radius: 10px; padding-left: 12px; margin: 0 -12px; }
    .trans-word-row.playing .trans-word-ab { color: var(--primary-light); }
    .btn-play-all {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, var(--accent3), #4aad5e);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-play-all:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(107,203,119,0.3); }
    .btn-play-all.playing { background: var(--accent); animation: pulse 1s infinite; }
    .btn-play-all:disabled { opacity: 0.4; cursor: default; transform: none; box-shadow: none; }
    /* Full translation sentence */
    .trans-sentence {
      margin-top: 16px;
      padding: 16px;
      background: rgba(108,99,255,0.08);
      border: 1px solid rgba(108,99,255,0.2);
      border-radius: 12px;
    }
    .trans-sentence-label {
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .trans-sentence-text {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      line-height: 1.8;
      word-break: break-all;
    }
    .trans-sentence-text .ts-word { display: inline; }
    .trans-sentence-text .ts-word.matched { color: var(--primary-light); }
    .trans-sentence-text .ts-word.unmatched { color: var(--text-dim); opacity: 0.4; }
    .trans-note {
      margin-top: 12px;
      padding: 12px 16px;
      background: rgba(255,107,107,0.08);
      border: 1px solid rgba(255,107,107,0.15);
      border-radius: 10px;
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.6;
    }
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    /* Responsive */
    @media (max-width: 600px) {
      .header h1 { font-size: 20px; }
      .word-indigenous { font-size: 28px; }
      .word-chinese { font-size: 20px; }
      .category-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); }
      .controls { flex-direction: column; }
      .controls select, .controls input, .controls .btn-action { width: 100%; }
      .list-header, .list-item { grid-template-columns: 32px 1fr 1fr 32px; font-size: 11px; }
      .trans-word-ch { min-width: 40px; font-size: 15px; }
      .trans-word-ab { font-size: 15px; }
      .translate-input-area textarea { font-size: 16px; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>🗣️ 族語翻譯互動學習</h1>
  <p>學習族語單詞 · 輸入中文逐詞翻譯</p>
  <div class="mode-tabs">
    <button class="mode-tab active" data-mode="learn">📖 學習</button>
    <button class="mode-tab" data-mode="translate">🔤 翻譯</button>
  </div>
</div>

<!-- ========== LEARN MODE ========== -->
<div class="section active" id="sectionLearn">
  <div class="controls">
    <label>🗂️ 族語</label>
    <select id="langSelect"></select>
    <label>📍 方言</label>
    <select id="dialectSelect"></select>
    <label>🔍 搜尋</label>
    <input id="searchInput" type="text" placeholder="中文字或族語關鍵字...">
  </div>
  <div class="container">
    <div class="section-title">📂 分類目錄 <span id="cateCount"></span></div>
    <div class="category-grid" id="categoryGrid"></div>
    <div class="status-bar">
      <div class="status-info" id="statusInfo">選擇分類開始學習 ✨</div>
      <button class="view-switch" id="viewSwitch">📋 列表模式</button>
    </div>
    <div class="word-area" id="wordArea">
      <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">載入中...</div>
      </div>
      <div class="error-msg" id="errorMsg"></div>
      <div class="word-card" id="wordCard">
        <div class="word-level" id="wordLevel"></div>
        <div class="word-number" id="wordNumber"></div>
        <div class="word-indigenous" id="wordAb">—</div>
        <div class="word-chinese" id="wordCh">請選擇分類</div>
        <div class="word-english" id="wordEn"></div>
        <div class="word-memo" id="wordMemo"></div>
        <div class="word-actions">
          <button class="btn-audio" id="btnAudio">▶</button>
        </div>
      </div>
      <div class="word-nav">
        <button class="nav-btn" id="prevBtn">◀ 上一筆</button>
        <span class="nav-count" id="navCount">0 / 0</span>
        <button class="nav-btn" id="nextBtn">下一筆 ▶</button>
      </div>
    </div>
    <div class="list-view" id="listView">
      <div class="list-header"><span>級別</span><span>族語</span><span>中文</span><span>音</span></div>
      <div id="listBody"></div>
    </div>
  </div>
</div>

<!-- ========== TRANSLATE MODE ========== -->
<div class="section" id="sectionTranslate">
  <div class="controls">
    <label>🗂️ 族語</label>
    <select id="langSelect2"></select>
    <label>📍 方言</label>
    <select id="dialectSelect2"></select>
    <button class="btn-action" id="loadDictBtn">📚 載入詞庫</button>
  </div>
  <div class="container">
    <div class="translate-area">
      <div class="dict-status" id="dictStatus">尚未載入詞庫，請先按「載入詞庫」📚</div>
      <div class="translate-input-area">
        <textarea id="transInput" placeholder="輸入中文句子，例如：我的眼睛很大&#10;&#10;提示：逐詞查詢，無文法變化"></textarea>
      </div>
      <div class="translate-actions">
        <button class="btn-translate" id="btnTranslate" disabled>🔤 翻譯</button>
        <span id="dictInfo"></span>
      </div>
      <div class="trans-result" id="transResult"></div>
    </div>
  </div>
</div>

<audio id="audioPlayer" preload="none"></audio>

function updateDialects(lid, sel) {

function syncLangFromLearn() {

function syncLangFromTranslate() {

async function callGradioAPI(apiBase, endpoint, data) {
  try {
    const res = await fetch(`${apiBase}/${endpoint}`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ data })
    });
    if (!res.ok) return null;
    const { event_id } = await res.json();
    await new Promise(r => setTimeout(r, 4000));
    const res2 = await fetch(`${apiBase}/${endpoint}/${event_id}`);
    if (!res2.ok) return null;
    const text = await res2.text();
    const match = text.match(/data:\s*(\[.*?\])/s);
    if (!match) return null;
    const parsed = JSON.parse(match[1]);
    return parsed[0];
  } catch (e) {
    return null;
  }
}

async function translateViaILRDF(text, did) {
  const info = DID_TO_ILRDF[did];
  if (!info) return null;
  const result = await callGradioAPI(
    ILRDF_TRANSLATE_API, "translate_1",
    [text, "zho_Hant", info.code]
  );
  return result || null;
}

async function ttsViaILRDF(text, did) {
  const info = DID_TO_ILRDF[did];
  if (!info) return null;
  // Use default speaker TTS (first speaker available for this ethnicity)
  // First get speaker list for this ethnicity
  const speakers = await callGradioAPI(ILRDF_TTS_API, "lambda", [info.eth]);
  if (!speakers || speakers.length === 0) return null;
  const speaker = speakers[0];
  const audioUrl = await callGradioAPI(ILRDF_TTS_API, "default_speaker_tts", [speaker, text]);
  return audioUrl || null;
}

async function selectCategory(cat) {

  $("loadingOverlay").style.display = "flex";
  statusInfo.textContent = `📥 正在讀取「${cat.replace(/^\d{2}/, "")}」...`;
  try {
    const url = `https://web.klokah.tw/vocabulary/php/getWords.php?did=${state.did}&cate=${encodeURIComponent(cat)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    statusInfo.innerHTML = `✅ <strong>${cat.replace(/^\d{2}/, "")}</strong> · 共 <strong>${state.words.length}</strong> 筆單詞`;

async function loadDictionary() {
  const did = dialSel2.value;
  if (dictState.loaded && dictState.did === did) { dictStatus.textContent = "✅ 詞庫已載入"; return; }
  if (dictState.loading) return;
  dictState.loading = true;
  dictState.did = did;
  dictState.dictionary = {};
  dictState.reverseDict = {};
  dictState.totalWords = 0;
  loadDictBtn.disabled = true;
  loadDictBtn.textContent = "⏳ 載入中...";
  dictStatus.textContent = "⏳ 正在載入全部 36 類詞庫...";
  dictStatus.className = "dict-status";
  btnTranslate.disabled = true;

  let total = 0, errors = 0;
  for (let i = 0; i < CATEGORIES.length; i++) {
    const cat = CATEGORIES[i];
    dictStatus.textContent = `⏳ 載入中 ${i+1}/${CATEGORIES.length}：${cat.replace(/^\d{2}/, "")}`;
    try {
      const url = `https://web.klokah.tw/vocabulary/php/getWords.php?did=${did}&cate=${encodeURIComponent(cat)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      data.forEach(w => {
        if (w.ch && w.ab) {
          // Store by Chinese (handle duplicate ch → multiple ab)
          if (!dictState.dictionary[w.ch]) dictState.dictionary[w.ch] = [];
          dictState.dictionary[w.ch].push({ ab: w.ab, n: w.n, snda: w.snda, lv: w.lv });
          dictState.reverseDict[w.ab] = w.ch;
          total++;
        }
      });
    } catch (e) {
      errors++;
    }
  }
  dictState.totalWords = total;
  dictState.loaded = true;
  dictState.loading = false;
  loadDictBtn.disabled = false;
  loadDictBtn.textContent = "📚 重新載入詞庫";
  btnTranslate.disabled = false;
  const dictSize = Object.keys(dictState.dictionary).length;
  dictStatus.innerHTML = `✅ 已載入 <strong class="dict-count">${total}</strong> 筆單詞（<strong class="dict-count">${dictSize}</strong> 個不同中文詞）${errors > 0 ? `，${errors} 類失敗` : ""}`;
  dictStatus.className = "dict-status loaded";
  // Merge supplementary glossary (教育部詞表) for current dialect
  const supp = getGlossaryForDid(did);
  if (supp) {
    let suppAdded = 0;
    for (const [ch, abList] of Object.entries(supp)) {
      if (!dictState.dictionary[ch]) {
        dictState.dictionary[ch] = abList.map(ab => ({ ab, n: null, snda: false }));
        dictState.reverseDict[abList[0]] = ch;
        suppAdded++;
        total++;
      }
    }
    if (suppAdded > 0) {
      dictStatus.innerHTML += ` ＋ <span style="color:var(--accent2)">📖 ${suppAdded} 詞</span>`;
      // Update the displayed dict size too
      const newDictSize = Object.keys(dictState.dictionary).length;
      dictStatus.innerHTML = dictStatus.innerHTML.replace(
        /（\d+ 個不同中文詞）/,
        `（${newDictSize} 個不同中文詞）`
      );
    }
  }
  dictState.totalWords = total;
  if (!transInput.value.trim()) btnTranslate.disabled = true;
}

// ============================================================
// TRANSLATE MODE — CHINESE → INDIGENOUS
// ============================================================
async function doTranslate() {
  const text = transInput.value.trim();
  if (!text || !dictState.loaded) return;
  btnTranslate.disabled = true;
  btnTranslate.textContent = "⏳ 翻譯中...";

  // 1. Segment Chinese text using forward maximum matching
  const segments = segmentChinese(text, dictState.dictionary);

  // 2. Build result
  let html = '';
  let sentenceParts = [];
  let matchedCount = 0, unmatchedCount = 0;
  let audioQueue = [];
  let qi = -1;

  segments.forEach(seg => {
    const ch = seg.word;
    const matches = dictState.dictionary[ch];
    if (matches && matches.length > 0) {
      matchedCount++;
      const m = matches[0];
      const audioUrl = m.snda && m.n ? `https://web.klokah.tw/vocabulary/audio/word/${dictState.did}/${m.n}.wav` : '';
      if (audioUrl) { qi++; audioQueue.push({ url: audioUrl, qi: qi }); }
      const hasAudio = audioUrl ? true : false;
      html += `<div class="trans-word-row" data-qi="${hasAudio ? qi : -1}">
        <span class="trans-word-ch">${escHtml(ch)}</span>
        <span class="trans-word-arrow">→</span>
        <span class="trans-word-ab">${escHtml(m.ab)}</span>
        ${audioUrl ? `<button class="trans-word-audio" data-url="${audioUrl}">🔊</button>` : '<span class="trans-word-audio" style="opacity:0.2">—</span>'}
      </div>`;
      sentenceParts.push(`<span class="ts-word matched">${escHtml(m.ab)}</span>`);
    } else {
      unmatchedCount++;
      const idx = qi + 1;  // unique index for this unmatched word
      html += `<div class="trans-word-row" data-ilrdf="${escHtml(ch)}" data-ilrdf-idx="${idx}">
        <span class="trans-word-ch">${escHtml(ch)}</span>
        <span class="trans-word-arrow">→</span>
        <span class="trans-word-ab unmatched">⏳ 查詢中...</span>
        <span class="trans-word-audio" style="opacity:0.2">—</span>
      </div>`;
      sentenceParts.push(`<span class="ts-word unmatched">${escHtml(ch)}</span>`);
    }
  });

  // Build full HTML
  const audioCount = audioQueue.length;
  const fullHtml = `
    <div class="trans-sentence">
      <div class="trans-sentence-label">📝 拼湊結果（逐詞對應，無文法）</div>
      <div class="trans-sentence-text">${sentenceParts.join(' ')}</div>
    </div>
    <div style="margin-top:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
      ${matchedCount > 0 ? `<span style="font-size:12px;color:var(--text-dim)">✅ ${matchedCount} 詞已找到對應${unmatchedCount > 0 ? ` · ⚠️ ${unmatchedCount} 詞未在詞庫中` : ''}</span>` : ''}
      ${audioCount > 0 ? `<button class="btn-play-all" id="btnPlayAll">🔊 全部朗讀（${audioCount} 詞）</button>` : ''}
    </div>
    <div class="trans-note">
      💡 這是「逐詞查字典」模式，非文法翻譯。族語與中文的語序可能不同，請對照單詞理解。
    </div>
    ${html}
  `;

  transResult.innerHTML = fullHtml;

  // Store audio queue for play-all
  transResult._audioQueue = audioQueue;
  transResult._playing = false;

  // Bind individual audio buttons
  transResult.querySelectorAll(".trans-word-audio").forEach(btn => {
    btn.addEventListener("click", () => {
      const url = btn.dataset.url;
      if (url) { stopPlayAll(); audioEl.src = url; audioEl.play().catch(() => {}); }
    });
  });

  // Bind play-all button
  const playAllBtn = document.getElementById("btnPlayAll");
  if (playAllBtn) {
    playAllBtn.addEventListener("click", () => {
      if (transResult._playing) { stopPlayAll(); }
      else { startPlayAll(); }
    });
  }

  // 🔁 ILRDF AI fallback: async lookup for unmatched words
  const ilrdfRows = transResult.querySelectorAll("[data-ilrdf]");
  if (ilrdfRows.length > 0 && DID_TO_ILRDF[dictState.did]) {
    const did = dictState.did;
    const unmatchedWords = [...new Set(
      Array.from(ilrdfRows).map(row => row.dataset.ilrdf)
    )];
    // Show an "AI查詢中" indicator
    const note = transResult.querySelector(".trans-note");
    if (note) {
      note.innerHTML += `<br>🤖 <span id="ilrdfStatus">AI 翻譯查詢 ${unmatchedWords.length} 詞...</span>`;
    }
    // Query each unique word
    for (const word of unmatchedWords) {
      const result = await translateViaILRDF(word, did);
      // Update all rows with this word
      transResult.querySelectorAll(`[data-ilrdf="${CSS.escape(word)}"]`).forEach(row => {
        const abSpan = row.querySelector(".trans-word-ab");
        const audioSpan = row.querySelector(".trans-word-audio");
        if (result) {
          abSpan.textContent = result;
          abSpan.className = "trans-word-ab";
          abSpan.style.color = "var(--accent4)";
          // Add AI badge
          const badge = document.createElement("span");
          badge.textContent = "🤖";
          badge.style.cssText = "font-size:11px;opacity:0.6;margin-left:6px";
          badge.title = "原語會AI翻譯";
          abSpan.appendChild(badge);
          // Remove the data-ilrdf attribute so it's not queried again
          row.removeAttribute("data-ilrdf");
        } else {
          abSpan.textContent = "（無對應詞）";
          abSpan.className = "trans-word-ab unmatched";
        }
      });
      // Update status
      const statusEl = document.getElementById("ilrdfStatus");
      if (statusEl) {
        const remaining = transResult.querySelectorAll("[data-ilrdf]").length;
        if (remaining > 0) {
          statusEl.textContent = `🤖 AI 翻譯查詢中... 剩 ${remaining} 詞`;
        } else {
          statusEl.textContent = `✅ AI 翻譯完成`;
        }
      }
    }
  }

  btnTranslate.disabled = false;
  btnTranslate.textContent = "🔤 翻譯";
}

function startPlayAll() {
  const queue = transResult._audioQueue;
  if (!queue || queue.length === 0) return;
  transResult._playing = true;
  transResult._currentPlayIdx = 0;
  const btn = document.getElementById("btnPlayAll");
  if (btn) { btn.textContent = "⏹ 停止"; btn.classList.add("playing"); }
  playNextInQueue();
}

function playNextInQueue() {
  const queue = transResult._audioQueue;
  const idx = transResult._currentPlayIdx;
  if (!transResult._playing || idx >= queue.length) {
    stopPlayAll();
    return;
  }
  // Highlight current row
  document.querySelectorAll(".trans-word-row").forEach(r => r.classList.remove("playing"));
  const target = document.querySelector(`.trans-word-row[data-qi="${queue[idx].qi}"]`);
  if (target) {
    target.classList.add("playing");
    target.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
  // Update button text
  const btn = document.getElementById("btnPlayAll");
  if (btn) btn.textContent = `🔊 朗讀中 ${idx + 1}/${queue.length}`;
  // Play audio
  audioEl.src = queue[idx].url;
  audioEl.play().catch(() => { stopPlayAll(); return; });
  audioEl.onended = () => {
    transResult._currentPlayIdx++;
    if (transResult._playing) playNextInQueue();
  };
}

function stopPlayAll() {
  transResult._playing = false;
  audioEl.pause();
  audioEl.currentTime = 0;
  document.querySelectorAll(".trans-word-row").forEach(r => r.classList.remove("playing"));
  const btn = document.getElementById("btnPlayAll");
  if (btn) { btn.textContent = "🔊 全部朗讀"; btn.classList.remove("playing"); }
}
function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function segmentChinese(text, dict) {
  // Get max key length from dictionary
  let maxLen = 4; // default max Chinese word length
  const keys = Object.keys(dict);
  if (keys.length > 0) {
    maxLen = Math.max(4, Math.min(10, keys.reduce((m, k) => Math.max(m, k.length), 0)));
  }

  const result = [];
  let i = 0;
  const chars = [...text]; // handle Unicode correctly

  while (i < chars.length) {
    const remaining = chars.length - i;
    let matched = false;

    // Try longest match first
    for (let len = Math.min(maxLen, remaining); len >= 1; len--) {
      const candidate = chars.slice(i, i + len).join('');
      // Check dictionary
      if (dict[candidate]) {
        result.push({ word: candidate, type: 'match' });
        i += len;
        matched = true;
        break;
      }
    }
    if (!matched) {
      // Single character, check if it's a Chinese character or punctuation
      const ch = chars[i];
      // Skip pure punctuation/whitespace
      if (/^[\s，。、！？；：""''（）【】《》\-\+\=\/\\·~\.\,\!\[\]\(\)\@\#\$\%\^\&\*＿　…—\u3000]+$/.test(ch)) {
        i++;
        continue;
      }
      result.push({ word: ch, type: 'unmatched' });
      i++;
    }
  }
  return result;
}

init();
</script>
