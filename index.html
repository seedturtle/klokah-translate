<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>族語翻譯互動學習</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f1a;
      --card: #1a1a2e;
      --card-hover: #222240;
      --primary: #6c63ff;
      --primary-light: #8b83ff;
      --accent: #ff6b6b;
      --accent2: #ffd93d;
      --accent3: #6bcb77;
      --text: #e8e8f0;
      --text-dim: #8888aa;
      --border: #2a2a4a;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    /* Header */
    .header {
      background: linear-gradient(135deg, #1a1a3e 0%, #2a1a4e 50%, #1a2a3e 100%);
      padding: 40px 20px 30px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .header h1 {
      font-size: 28px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary-light), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header p {
      color: var(--text-dim);
      font-size: 14px;
      margin-top: 8px;
    }
    /* Controls */
    .controls {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 16px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    .controls label {
      font-size: 13px;
      color: var(--text-dim);
      font-weight: 500;
    }
    .controls select, .controls input {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
      flex: 1;
      min-width: 140px;
    }
    .controls select:focus, .controls input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(108,99,255,0.2);
    }
    .controls select option { background: var(--card); color: var(--text); }
    /* Category Grid */
    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 0 16px;
    }
    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-dim);
      margin: 24px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title span { color: var(--primary-light); }
    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
      margin-bottom: 20px;
    }
    .category-btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 8px;
      color: var(--text-dim);
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      line-height: 1.4;
    }
    .category-btn:hover {
      background: var(--card-hover);
      border-color: var(--primary);
      color: var(--text);
      transform: translateY(-1px);
    }
    .category-btn.active {
      background: linear-gradient(135deg, rgba(108,99,255,0.3), rgba(108,99,255,0.1));
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 0 20px rgba(108,99,255,0.15);
    }
    /* Word Display */
    .word-area {
      margin: 16px 0 40px;
    }
    .word-card {
      background: linear-gradient(145deg, #1e1e38, #16162a);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      position: relative;
      overflow: hidden;
      min-height: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .word-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 50% 50%, rgba(108,99,255,0.04) 0%, transparent 60%);
      pointer-events: none;
    }
    .word-level {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(108,99,255,0.2);
      color: var(--primary-light);
      font-size: 11px;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 500;
    }
    .word-number {
      position: absolute;
      top: 16px;
      right: 16px;
      color: var(--text-dim);
      font-size: 11px;
      opacity: 0.5;
    }
    .word-indigenous {
      font-size: 42px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 1px;
      margin-bottom: 4px;
      text-shadow: 0 0 30px rgba(108,99,255,0.2);
    }
    .word-chinese {
      font-size: 28px;
      font-weight: 500;
      color: var(--accent2);
      margin-bottom: 8px;
    }
    .word-english {
      font-size: 14px;
      color: var(--text-dim);
      font-style: italic;
    }
    .word-memo {
      font-size: 13px;
      color: var(--accent3);
      margin-top: 10px;
      opacity: 0.8;
    }
    .word-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    .btn-audio {
      background: var(--primary);
      border: none;
      border-radius: 50%;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 22px;
      color: #fff;
      box-shadow: 0 4px 15px rgba(108,99,255,0.3);
    }
    .btn-audio:hover { transform: scale(1.1); background: var(--primary-light); }
    .btn-audio:active { transform: scale(0.95); }
    .btn-audio.playing { animation: pulse 1s infinite; }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(108,99,255,0.5); }
      50% { box-shadow: 0 0 0 15px rgba(108,99,255,0); }
    }
    /* Navigation */
    .word-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 16px;
    }
    .nav-btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 20px;
      color: var(--text);
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .nav-btn:hover { background: var(--card-hover); border-color: var(--primary); }
    .nav-btn:disabled { opacity: 0.3; cursor: default; }
    .nav-count {
      color: var(--text-dim);
      font-size: 13px;
      min-width: 60px;
      text-align: center;
    }
    /* Loading Overlay */
    .loading-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(15,15,26,0.85);
      border-radius: 20px;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 10;
      gap: 16px;
    }
    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-text { color: var(--text-dim); font-size: 14px; }
    .error-msg {
      display: none;
      padding: 40px;
      text-align: center;
      color: var(--accent);
      font-size: 15px;
    }
    .word-area { position: relative; }
    /* List View */
    .list-view {
      display: none;
      margin: 16px 0 40px;
    }
    .list-view.active { display: block; }
    .list-header {
      display: grid;
      grid-template-columns: 50px 1fr 1fr 50px;
      gap: 8px;
      padding: 10px 16px;
      font-size: 12px;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      font-weight: 500;
    }
    .list-item {
      display: grid;
      grid-template-columns: 50px 1fr 1fr 50px;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      cursor: pointer;
      transition: background 0.15s;
      align-items: center;
    }
    .list-item:hover { background: var(--card-hover); }
    .list-item.active { background: rgba(108,99,255,0.1); border-left: 3px solid var(--primary); }
    .list-item .li-level { font-size: 11px; color: var(--primary-light); }
    .list-item .li-ab { font-size: 15px; font-weight: 500; color: #fff; }
    .list-item .li-ch { font-size: 14px; color: var(--accent2); }
    .list-item .li-sound {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 34px;
      height: 34px;
      cursor: pointer;
      color: var(--text-dim);
      font-size: 16px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .list-item .li-sound:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
    /* Switch view button */
    .view-switch {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 16px;
      color: var(--text-dim);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .view-switch:hover { background: var(--card-hover); color: var(--text); }
    /* Loading */
    .loading {
      padding: 60px;
      text-align: center;
      color: var(--text-dim);
    }
    .loading::after {
      content: '';
      display: block;
      width: 30px;
      height: 30px;
      margin: 20px auto;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* Status */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .status-info {
      font-size: 13px;
      color: var(--text-dim);
    }
    .status-info strong { color: var(--text); }
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    /* Responsive */
    @media (max-width: 600px) {
      .header h1 { font-size: 22px; }
      .word-indigenous { font-size: 30px; }
      .word-chinese { font-size: 22px; }
      .category-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
      .controls { flex-direction: column; }
      .controls select, .controls input { width: 100%; }
      .list-header, .list-item { grid-template-columns: 40px 1fr 1fr 40px; font-size: 12px; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>🗣️ 族語翻譯互動學習</h1>
  <p>選擇族語 → 瀏覽分類 → 點擊單詞聽發音・學翻譯</p>
</div>

<div class="controls">
  <label>🗂️ 族語</label>
  <select id="langSelect"></select>
  <label>📍 方言</label>
  <select id="dialectSelect"></select>
  <label>🔍 搜尋</label>
  <input id="searchInput" type="text" placeholder="中文字或族語關鍵字...">
</div>

<div class="container">
  <div class="section-title">
    📂 分類目錄 <span id="cateCount"></span>
  </div>
  <div class="category-grid" id="categoryGrid"></div>

  <div class="status-bar">
    <div class="status-info" id="statusInfo">選擇分類開始學習 ✨</div>
    <div>
      <button class="view-switch" id="viewSwitch">📋 列表模式</button>
    </div>
  </div>

  <!-- Card View -->
  <div class="word-area" id="wordArea">
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loading-spinner"></div>
      <div class="loading-text">載入中...</div>
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <div class="word-card" id="wordCard">
      <div class="word-level" id="wordLevel"></div>
      <div class="word-number" id="wordNumber"></div>
      <div class="word-indigenous" id="wordAb">—</div>
      <div class="word-chinese" id="wordCh">請選擇分類</div>
      <div class="word-english" id="wordEn"></div>
      <div class="word-memo" id="wordMemo"></div>
      <div class="word-actions">
        <button class="btn-audio" id="btnAudio">▶</button>
      </div>
    </div>
    <div class="word-nav">
      <button class="nav-btn" id="prevBtn">◀ 上一筆</button>
      <span class="nav-count" id="navCount">0 / 0</span>
      <button class="nav-btn" id="nextBtn">下一筆 ▶</button>
    </div>
  </div>

  <!-- List View -->
  <div class="list-view" id="listView">
    <div class="list-header">
      <span>級別</span><span>族語</span><span>中文</span><span>音</span>
    </div>
    <div id="listBody"></div>
  </div>
</div>

<audio id="audioPlayer" preload="none"></audio>

<script>
// ============================================================
// DATA
// ============================================================
const LANGUAGES = [
  { lid: "1",  layer: 1, lch: "阿美語" },
  { lid: "2",  layer: 1, lch: "泰雅語" },
  { lid: "3",  layer: 1, lch: "賽夏語" },
  { lid: "4",  layer: 1, lch: "邵語" },
  { lid: "5",  layer: 1, lch: "賽德克語" },
  { lid: "6",  layer: 1, lch: "布農語" },
  { lid: "7",  layer: 1, lch: "排灣語" },
  { lid: "8",  layer: 1, lch: "魯凱語" },
  { lid: "9",  layer: 2, lch: "太魯閣語" },
  { lid: "10", layer: 2, lch: "噶瑪蘭語" },
  { lid: "11", layer: 2, lch: "鄒語" },
  { lid: "12", layer: 2, lch: "卑南語" },
  { lid: "13", layer: 2, lch: "雅美語" },
  { lid: "14", layer: 2, lch: "撒奇萊雅語" },
  { lid: "15", layer: 2, lch: "卡那卡那富語" },
  { lid: "16", layer: 2, lch: "拉阿魯哇語" },
];

const DIALECTS = [
  { lid: "1",  did: "1",  dch: "南勢阿美語" },
  { lid: "1",  did: "2",  dch: "秀姑巒阿美語" },
  { lid: "1",  did: "3",  dch: "海岸阿美語" },
  { lid: "1",  did: "4",  dch: "馬蘭阿美語" },
  { lid: "1",  did: "5",  dch: "恆春阿美語" },
  { lid: "2",  did: "6",  dch: "賽考利克泰雅語" },
  { lid: "2",  did: "7",  dch: "澤敖利泰雅語" },
  { lid: "2",  did: "8",  dch: "汶水泰雅語" },
  { lid: "2",  did: "9",  dch: "萬大泰雅語" },
  { lid: "2",  did: "10", dch: "四季泰雅語" },
  { lid: "2",  did: "11", dch: "宜蘭澤敖利泰雅語" },
  { lid: "3",  did: "13", dch: "賽夏語" },
  { lid: "4",  did: "14", dch: "邵語" },
  { lid: "5",  did: "15", dch: "都達賽德克語" },
  { lid: "5",  did: "16", dch: "德固達雅賽德克語" },
  { lid: "5",  did: "17", dch: "德鹿谷賽德克語" },
  { lid: "6",  did: "18", dch: "卓群布農語" },
  { lid: "6",  did: "19", dch: "卡群布農語" },
  { lid: "6",  did: "20", dch: "丹群布農語" },
  { lid: "6",  did: "21", dch: "巒群布農語" },
  { lid: "6",  did: "22", dch: "郡群布農語" },
  { lid: "7",  did: "23", dch: "東排灣語" },
  { lid: "7",  did: "24", dch: "北排灣語" },
  { lid: "7",  did: "25", dch: "中排灣語" },
  { lid: "7",  did: "26", dch: "南排灣語" },
  { lid: "8",  did: "27", dch: "東魯凱語" },
  { lid: "8",  did: "28", dch: "霧台魯凱語" },
  { lid: "8",  did: "29", dch: "大武魯凱語" },
  { lid: "8",  did: "30", dch: "多納魯凱語" },
  { lid: "8",  did: "31", dch: "茂林魯凱語" },
  { lid: "8",  did: "32", dch: "萬山魯凱語" },
  { lid: "9",  did: "33", dch: "太魯閣語" },
  { lid: "10", did: "34", dch: "噶瑪蘭語" },
  { lid: "11", did: "35", dch: "鄒語" },
  { lid: "12", did: "38", dch: "南王卑南語" },
  { lid: "12", did: "39", dch: "知本卑南語" },
  { lid: "12", did: "40", dch: "西群卑南語" },
  { lid: "12", did: "41", dch: "建和卑南語" },
  { lid: "13", did: "42", dch: "雅美語" },
  { lid: "14", did: "43", dch: "撒奇萊雅語" },
  { lid: "15", did: "36", dch: "卡那卡那富語" },
  { lid: "16", did: "37", dch: "拉阿魯哇語" },
];

const CATEGORIES = [
  "01數字計量","02代名詞、指示詞","03疑問詞","04親屬稱謂",
  "05人物、身分","06身體部位","07動物(含昆蟲)","08植物",
  "09物品(不含食品)","10山川地理","11自然景觀","12建築",
  "13時間","14空間","15農耕","16狩獵","17宗教",
  "18織布服飾","19傳統文化與習俗","20交通","21食物(非植物)",
  "22顏色","23聲音","24抽象名詞","25行動","26肢體動作",
  "27飲食","28認知感官","29情緒思維","30生活作息",
  "31生老病死傷","32特徵","33助動詞","34其他","35否定詞",
  "36助詞或其他"
];

// ============================================================
// STATE
// ============================================================
let state = {
  did: "1",
  words: [],
  currentIndex: 0,
  category: "",
  viewMode: "card", // card | list
};

// ============================================================
// DOM REFS
// ============================================================
const $ = id => document.getElementById(id);
const langSel = $("langSelect");
const dialSel = $("dialectSelect");
const searchInput = $("searchInput");
const cateGrid = $("categoryGrid");
const cateCount = $("cateCount");
const statusInfo = $("statusInfo");
const wordArea = $("wordArea");
const wordCard = $("wordCard");
const wordLevel = $("wordLevel");
const wordNumber = $("wordNumber");
const wordAb = $("wordAb");
const wordCh = $("wordCh");
const wordEn = $("wordEn");
const wordMemo = $("wordMemo");
const btnAudio = $("btnAudio");
const navCount = $("navCount");
const prevBtn = $("prevBtn");
const nextBtn = $("nextBtn");
const viewSwitch = $("viewSwitch");
const listView = $("listView");
const listBody = $("listBody");
const audioEl = $("audioPlayer");

// ============================================================
// INIT
// ============================================================
function init() {
  // Populate languages
  LANGUAGES.forEach(l => {
    const opt = document.createElement("option");
    opt.value = l.lid;
    opt.textContent = l.lch;
    langSel.appendChild(opt);
  });
  langSel.value = "1";
  updateDialects("1");
  dialSel.value = "1";
  renderCategories();
}

function updateDialects(lid) {
  dialSel.innerHTML = "";
  const filtered = DIALECTS.filter(d => d.lid === lid);
  filtered.forEach(d => {
    const opt = document.createElement("option");
    opt.value = d.did;
    opt.textContent = d.dch;
    dialSel.appendChild(opt);
  });
}

// ============================================================
// RENDER CATEGORIES
// ============================================================
function renderCategories() {
  cateGrid.innerHTML = "";
  CATEGORIES.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "category-btn" + (cat === state.category ? " active" : "");
    btn.textContent = cat.replace(/^\d{2}/, ""); // strip "01" prefix for display
    btn.title = cat;
    btn.dataset.cate = cat;
    btn.addEventListener("click", () => selectCategory(cat));
    cateGrid.appendChild(btn);
  });
  cateCount.textContent = `（${CATEGORIES.length} 類）`;
}

function highlightCategory(cat) {
  document.querySelectorAll(".category-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.cate === cat);
  });
}

// ============================================================
// SELECT CATEGORY → FETCH WORDS
// ============================================================
async function selectCategory(cat) {
  state.category = cat;
  state.currentIndex = 0;
  highlightCategory(cat);

  // Show loading overlay
  document.getElementById("loadingOverlay").style.display = "flex";
  statusInfo.textContent = `📥 正在讀取「${cat.replace(/^\d{2}/, "")}」...`;

  try {
    const url = `https://web.klokah.tw/vocabulary/php/getWords.php?did=${state.did}&cate=${encodeURIComponent(cat)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    state.words = data;
    renderWordView();
    statusInfo.innerHTML = `✅ <strong>${cat.replace(/^\d{2}/, "")}</strong> · 共 <strong>${data.length}</strong> 筆單詞`;
  } catch (e) {
    document.getElementById("loadingOverlay").style.display = "none";
    document.getElementById("errorMsg").style.display = "block";
    document.getElementById("errorMsg").textContent = `❌ 讀取失敗：${e.message}`;
    statusInfo.textContent = "❌ 讀取失敗";
  }
  document.getElementById("loadingOverlay").style.display = "none";
}

// ============================================================
// RENDER WORD (Card + List)
// ============================================================
function renderWordView() {
  const words = state.words;
  if (!words || words.length === 0) {
    document.getElementById("errorMsg").style.display = "block";
    document.getElementById("errorMsg").textContent = "📭 此分類尚無資料";
    wordArea.querySelector(".word-card").style.display = "none";
    wordArea.querySelector(".word-nav").style.display = "none";
    listView.classList.remove("active");
    return;
  }
  document.getElementById("errorMsg").style.display = "none";
  wordArea.querySelector(".word-card").style.display = "";
  wordArea.querySelector(".word-nav").style.display = "";
  // Card
  // Card
  renderCard();
  // List
  renderList();

  // Show/hide views
  if (state.viewMode === "card") {
    wordArea.style.display = "block";
    listView.classList.remove("active");
  } else {
    wordArea.style.display = "none";
    listView.classList.add("active");
  }
}

function renderCard() {
  const w = state.words[state.currentIndex];
  if (!w) return;

  wordLevel.textContent = w.lv || "—";
  wordNumber.textContent = w.n || "";
  wordAb.textContent = w.ab || "—";
  wordCh.textContent = w.ch || "—";
  wordEn.textContent = w.en ? `🏴 ${w.en}` : "";
  wordMemo.textContent = w.memo || "";

  navCount.textContent = `${state.currentIndex + 1} / ${state.words.length}`;
  prevBtn.disabled = state.currentIndex === 0;
  nextBtn.disabled = state.currentIndex >= state.words.length - 1;

  // Audio
  if (w.snda && w.n) {
    const audioUrl = `https://web.klokah.tw/vocabulary/audio/word/${state.did}/${w.n}.wav`;
    btnAudio.dataset.url = audioUrl;
    btnAudio.style.opacity = "1";
    btnAudio.style.cursor = "pointer";
  } else {
    btnAudio.dataset.url = "";
    btnAudio.style.opacity = "0.3";
    btnAudio.style.cursor = "default";
  }
}

function renderList() {
  listBody.innerHTML = "";
  state.words.forEach((w, i) => {
    const div = document.createElement("div");
    div.className = "list-item" + (i === state.currentIndex ? " active" : "");
    div.innerHTML = `
      <span class="li-level">${w.lv || ""}</span>
      <span class="li-ab">${w.ab || ""}</span>
      <span class="li-ch">${w.ch || ""}</span>
      <button class="li-sound" data-url="${w.snda && w.n ? `https://web.klokah.tw/vocabulary/audio/word/${state.did}/${w.n}.wav` : ''}">${w.snda ? '🔊' : '—'}</button>
    `;
    div.addEventListener("click", (e) => {
      if (e.target.closest(".li-sound")) return;
      state.currentIndex = i;
      if (state.viewMode === "list") renderCard();
      renderList();
      document.querySelector(".list-item.active")?.scrollIntoView({ block: "nearest" });
    });
    const soundBtn = div.querySelector(".li-sound");
    if (soundBtn) {
      soundBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const url = soundBtn.dataset.url;
        if (url) playAudio(url);
      });
    }
    listBody.appendChild(div);
  });
}

// ============================================================
// AUDIO PLAYBACK
// ============================================================
function playAudio(url) {
  if (!url) return;
  audioEl.src = url;
  audioEl.play().catch(() => {});
  btnAudio.classList.add("playing");
  btnAudio.textContent = "⏹";
  audioEl.onended = () => {
    btnAudio.classList.remove("playing");
    btnAudio.textContent = "▶";
  };
}

// ============================================================
// SEARCH
// ============================================================
searchInput.addEventListener("input", () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) {
    document.querySelectorAll(".list-item").forEach(el => el.style.display = "");
    return;
  }
  document.querySelectorAll(".list-item").forEach(el => {
    const text = el.textContent.toLowerCase();
    el.style.display = text.includes(q) ? "" : "none";
  });
});

// ============================================================
// EVENT LISTENERS
// ============================================================

// Language change
langSel.addEventListener("change", () => {
  const lid = langSel.value;
  updateDialects(lid);
  dialSel.value = DIALECTS.find(d => d.lid === lid).did;
  state.did = dialSel.value;
  state.words = [];
  state.category = "";
  renderCategories();
  wordAb.textContent = "—";
  wordCh.textContent = "選擇分類";
  wordEn.textContent = "";
  wordMemo.textContent = "";
  wordLevel.textContent = "";
  wordNumber.textContent = "";
  navCount.textContent = "0 / 0";
  statusInfo.textContent = `🌐 已切換至 ${langSel.options[langSel.selectedIndex].text}`;
  listView.classList.remove("active");
  wordArea.style.display = "block";
});

// Dialect change
dialSel.addEventListener("change", () => {
  state.did = dialSel.value;
  if (state.category) selectCategory(state.category);
  else {
    statusInfo.textContent = `📍 已切換至 ${dialSel.options[dialSel.selectedIndex].text}`;
  }
});

// Navigation
prevBtn.addEventListener("click", () => {
  if (state.currentIndex > 0) { state.currentIndex--; renderWordView(); }
});
nextBtn.addEventListener("click", () => {
  if (state.currentIndex < state.words.length - 1) { state.currentIndex++; renderWordView(); }
});

// Audio button
btnAudio.addEventListener("click", () => {
  if (btnAudio.dataset.url) {
    if (audioEl.paused) {
      playAudio(btnAudio.dataset.url);
    } else {
      audioEl.pause();
      audioEl.currentTime = 0;
      btnAudio.classList.remove("playing");
      btnAudio.textContent = "▶";
    }
  }
});

// Keyboard shortcuts
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowLeft") prevBtn.click();
  if (e.key === "ArrowRight") nextBtn.click();
  if (e.key === " ") { e.preventDefault(); btnAudio.click(); }
});

// View switch
viewSwitch.addEventListener("click", () => {
  if (state.viewMode === "card") {
    state.viewMode = "list";
    viewSwitch.textContent = "🃏 卡片模式";
    renderWordView();
  } else {
    state.viewMode = "card";
    viewSwitch.textContent = "📋 列表模式";
    renderWordView();
  }
});

// ============================================================
// START
// ============================================================
init();
</script>
</body>
</html>
