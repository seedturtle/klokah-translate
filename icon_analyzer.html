<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Icon Analyzer</title></head>
<body style="background:#f5f5f5;font-family:sans-serif">
  <h2>User's Image:</h2>
  <img id="img" src="test_icon.jpg" style="border:2px solid red;max-width:100%">
  <canvas id="c" style="display:none"></canvas>
  <h3>Pixel Analysis:</h3>
  <pre id="info">Loading...</pre>
  <script>
    const img = document.getElementById('img');
    img.onload = function() {
      const c = document.getElementById('c');
      c.width = img.naturalWidth;
      c.height = img.naturalHeight;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);
      
      // Get center row of pixels for a "scan line"
      const midY = Math.floor(c.height / 2);
      const scanLine = ctx.getImageData(0, midY, c.width, 1).data;
      
      // Find transitions (where dark pixels start/end)
      let segments = [];
      let inDark = false;
      let segStart = 0;
      const threshold = 150;
      
      for (let x = 0; x < c.width; x++) {
        const idx = x * 4;
        const brightness = (scanLine[idx] + scanLine[idx+1] + scanLine[idx+2]) / 3;
        const isDark = brightness < threshold;
        
        if (isDark && !inDark) {
          segStart = x;
          inDark = true;
        } else if (!isDark && inDark) {
          segments.push({start: segStart, end: x, width: x - segStart});
          inDark = false;
        }
      }
      if (inDark) segments.push({start: segStart, end: c.width, width: c.width - segStart});
      
      let info = `Image: ${c.width} x ${c.height}\n\n`;
      info += `Midline (y=${midY}) dark segments (text/graphic zones):\n`;
      segments.forEach((s, i) => {
        info += `  Zone ${i+1}: x=${s.start}-${s.end} (${s.width}px wide)\n`;
      });
      
      // Sample dominant colors in each third
      const thirds = [
        {name: "Left (0-30%)", x1: 0, x2: Math.floor(c.width*0.3)},
        {name: "Middle (30-70%)", x1: Math.floor(c.width*0.3), x2: Math.floor(c.width*0.7)},
        {name: "Right (70-100%)", x1: Math.floor(c.width*0.7), x2: c.width}
      ];
      
      thirds.forEach(t => {
        const data = ctx.getImageData(t.x1, 0, t.x2 - t.x1, c.height).data;
        let whitePx = 0, darkPx = 0, otherPx = 0;
        const colorCount = {};
        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i+1], b = data[i+2];
          if (r > 240 && g > 240 && b > 240) whitePx++;
          else if (r < 60 && g < 60 && b < 60) darkPx++;
          else {
            otherPx++;
            // Quantize to reduce noise
            const key = `${Math.floor(r/32)*32},${Math.floor(g/32)*32},${Math.floor(b/32)*32}`;
            colorCount[key] = (colorCount[key] || 0) + 1;
          }
        }
        info += `\n${t.name}:\n`;
        info += `  White: ${whitePx}, Dark: ${darkPx}, Other: ${otherPx}\n`;
        const sorted = Object.entries(colorCount).sort((a,b) => b[1] - a[1]).slice(0,3);
        sorted.forEach(([color, count]) => {
          info += `  Color RGB(${color}): ${count}px\n`;
        });
      });
      
      document.getElementById('info').textContent = info;
    };
  </script>
</body>
</html>
